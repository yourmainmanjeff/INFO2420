<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rent a Pet - Graphics</title>

<style type="text/css">

body {
    background-color: #f5b34f; 
    background-image: url('images/wood1.png'); /* Set the background image */
    background-repeat: repeat-y; 
	}

	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:500px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/booknow_orange.png"
	PrintButton2.src = "images/booknow_white.png"
	logo1.src = "images/Logo1.png"
	logo2.src = "images/Logo.png"
}


		var imgArray = new Array(
			'CoupleBike3Lg.jpg',
			'CoupleBike1Lg.jpg',
			'SkiCouple3Lg.jpg',
			'CoupleSnowBoardLg.jpg'
			

		);


		var titleArray = new Array(
			'Sunset Biking in Zion',
			'Biking trails in Sundance',
			'Season passes to Brighton',
			'Snowbard and gear Rentals!'
			
		);
			
		var imgPath = "Honeymoon/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">

<div>
	<a href="" onMouseOver="document.PrintButton.src=PrintButton2.src;"
	onMouseOut="document.PrintButton.src=PrintButton1.src;">

	<img src="images/booknow_orange.png" width="250" height="50" 
	name="PrintButton" alt="PrintButton" style="border:none;"/>

	</a>
</div>


<div id="logo">
	<a href="logo.html" onMouseOver="document.logo.src=logo2.src;"
	onMouseOut="document.logo.src=logo1.src;">

	<img src="images/Logo1.png" width="133" height="126" 
	name="logo" alt="logo" style="border:none;"/>

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="Honeymoon/CoupleBike3sm.jpg" alt="Sunset Biking" onmouseover="swapImage(0);" />
		<img src="Honeymoon/CoupleBike1Lg.jpg" alt="Two hunting Dogs" onmouseover="swapImage(1);" />
		<img src="Honeymoon/SkiCouple3Lg.jpg" alt="Dog and two kids" onmouseover="swapImage(2);" />
		<img src="Honeymoon/CoupleSnowBoardLg.jpg" alt="Woman and Dog" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="Honeymoon/SnowShoeingLg.jpg" alt="Dog doing trick" />
		<h3 id="bottomText">Snow Shoeing in Alaska!</h3>
	</div>



<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
