<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons – Site Design</title>
<style type="text/css">
body { background-color: #FAF3E8; color: #3B2A1E; font-family: Georgia, "Times New Roman", serif; margin: 20px 40px; }
h1 { color: #A63A2E; font-family: Arial, Helvetica, sans-serif; text-align: center; }
table { border-collapse: collapse; margin: 0 auto; }
th, td { border: 1px solid #3B2A1E; padding: 8px 14px; text-align: left; }
th { background-color: #C97B3D; color: #FAF3E8; font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<h1>Site Color Palette</h1>
<table>
<tr><th>Swatch</th><th>Hex</th><th>Used For</th></tr>
<tr><td style="background-color:#FAF3E8"></td><td>#FAF3E8</td><td>Page background (cream)</td></tr>
<tr><td style="background-color:#3B2A1E"></td><td>#3B2A1E</td><td>Body text (dark brown)</td></tr>
<tr><td style="background-color:#A63A2E"></td><td>#A63A2E</td><td>Headings (brick red), link hover</td></tr>
<tr><td style="background-color:#C97B3D"></td><td>#C97B3D</td><td>Accent: borders, subheadings (burnt orange)</td></tr>
<tr><td style="background-color:#6B4226"></td><td>#6B4226</td><td>Links, quotes (medium brown)</td></tr>
<tr><td style="background-color:#8B5E3C"></td><td>#8B5E3C</td><td>Visited links (light brown)</td></tr>
</table>
</body>
</html>
